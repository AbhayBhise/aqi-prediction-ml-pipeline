version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aqi_backend
    ports:
      - "7860:7860"
    environment:
      - FLASK_ENV=production
      - PORT=7860
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    volumes:
      - ./data:/app/data
      - ./model_results:/app/model_results

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aqi_frontend
    ports:
      - "80:80"
    depends_on:
      - backend

  mlflow:
    image: python:3.10-slim
    container_name: aqi_mlflow
    ports:
      - "5000:5000"
    command: >
      bash -c "pip install mlflow && mlflow server --host 0.0.0.0 --port 5000"
    volumes:
      - ./mlruns:/mlruns

  prometheus:
    image: prom/prometheus:latest
    container_name: aqi_prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    container_name: aqi_grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
